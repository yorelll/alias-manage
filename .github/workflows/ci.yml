name: CI

on:
  push:
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          cache-on-failure: true
      - run: cargo fmt --all
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          cache-on-failure: true
      - name: Isolate test configuration
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aliasmgr-home" "$RUNNER_TEMP/aliasmgr-config"
          echo "HOME=$RUNNER_TEMP/aliasmgr-home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/aliasmgr-config" >> "$GITHUB_ENV"
          echo "ALIASMGR_CONFIG_DIR=$RUNNER_TEMP/aliasmgr-config/alias-manager" >> "$GITHUB_ENV"
      - run: cargo test --workspace
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          cache-on-failure: true
      - name: Isolate Windows test configuration
        shell: pwsh
        run: |
          $isolatedHome = Join-Path $env:RUNNER_TEMP 'aliasmgr-home'
          $config = Join-Path $env:RUNNER_TEMP 'aliasmgr-config'
          New-Item -ItemType Directory -Force -Path $isolatedHome, $config | Out-Null
          "USERPROFILE=$home" >> $env:GITHUB_ENV
          "LOCALAPPDATA=$config" >> $env:GITHUB_ENV
          "APPDATA=$config" >> $env:GITHUB_ENV
          "ALIASMGR_CONFIG_DIR=$(Join-Path $config 'alias-manager')" >> $env:GITHUB_ENV
      - name: PowerShell 5.1 version
        shell: powershell
        run: $PSVersionTable.PSVersion.ToString()
      - name: PowerShell 7 version
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()
      - run: cargo test --workspace

  # GUI frontend jobs (crates/aliasmgr-gui/src-tauri is intentionally outside the
  # root Cargo workspace; it requires platform-specific Tauri system libraries
  # (webkit2gtk on Linux, WebView2 on Windows) that are non-trivial to provision
  # reliably across runners.  We therefore verify only the frontend layer here and
  # document the Tauri Rust compile step as a manual / future-CI concern.
  gui-frontend-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/aliasmgr-gui/ui
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/aliasmgr-gui/ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  gui-frontend-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/aliasmgr-gui/ui
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/aliasmgr-gui/ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
