name: Integration
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths: ["crates/aliasmgr-core/**", "crates/aliasmgr-tests/**", ".github/workflows/integration.yml", "scripts/verify-*-linux.sh"]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shell: bash
            test: bash
          - os: ubuntu-24.04
            shell: bash
            test: lock_process
          - os: ubuntu-24.04
            shell: bash
            test: bash_shell
          - os: ubuntu-24.04
            shell: bash
            test: zsh_shell
          - os: windows-latest
            shell: powershell
            test: powershell5
          - os: windows-latest
            shell: pwsh
            test: powershell7
          - os: windows-latest
            shell: pwsh
            test: lock_process
          - os: ubuntu-24.04
            shell: bash
            test: cli_layers
          - os: ubuntu-24.04
            shell: bash
            test: benchmark
          - os: ubuntu-24.04
            shell: bash
            test: oh_my_zsh_contract
          - os: windows-latest
            shell: pwsh
            test: cli_layers
          - os: ubuntu-24.04
            shell: bash
            test: linux_verify_scripts

      # Linux package installation is isolated to the Zsh/oh-my-zsh contract jobs.
      # If the runner package mirror is unavailable, the job records an environment blocker.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          cache-on-failure: true
      - name: Isolate Linux configuration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aliasmgr-config"
          echo "ALIASMGR_CONFIG_DIR=$RUNNER_TEMP/aliasmgr-config/alias-manager" >> "$GITHUB_ENV"
      - name: Isolate Windows configuration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'aliasmgr-config'
          New-Item -ItemType Directory -Force -Path $config | Out-Null
          "ALIASMGR_CONFIG_DIR=$(Join-Path $config 'alias-manager')" >> $env:GITHUB_ENV
      - name: Run smoke integration test
        if: matrix.test == 'bash'
        run: cargo test -p aliasmgr-tests --test lock
      - name: Install Zsh
        if: matrix.test == 'zsh_shell'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run Bash adapter test
        if: matrix.test == 'bash_shell'
        run: cargo test -p aliasmgr-tests --test bash
      - name: Run Zsh adapter test
        if: matrix.test == 'zsh_shell'
        run: cargo test -p aliasmgr-tests --test zsh
      - name: Run PowerShell 5.1 adapter test
        if: matrix.test == 'powershell5'
        shell: powershell
        run: cargo test -p aliasmgr-tests --test powershell
      - name: Run PowerShell 7 adapter test
        if: matrix.test == 'powershell7'
        shell: pwsh
        run: cargo test -p aliasmgr-tests --test powershell
      - name: Run process lock test
        if: matrix.test == 'lock_process'
        run: cargo test -p aliasmgr-tests --test lock_process
      - name: Run CLI layered evidence test
        if: matrix.test == 'cli_layers'
        shell: bash
        run: cargo test -p aliasmgr-tests --test cli_layers
      - name: Run generation benchmark
        if: matrix.test == 'benchmark'
        shell: bash
        run: cargo test -p aliasmgr-tests --test benchmark -- --nocapture
      - name: Install oh-my-zsh contract dependencies
        if: matrix.test == 'oh_my_zsh_contract'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Run oh-my-zsh contract test
        if: matrix.test == 'oh_my_zsh_contract'
        shell: bash
        run: cargo test -p aliasmgr-tests --test zsh
      - name: Run shell syntax tests
        if: matrix.test == 'bash' || matrix.test == 'zsh_shell' || matrix.test == 'oh_my_zsh_contract'
        run: cargo test -p aliasmgr-tests --test shell_syntax
      - name: Build CLI binary for Linux verify scripts
        if: matrix.test == 'linux_verify_scripts'
        shell: bash
        run: cargo build -p aliasmgr-cli --release
      - name: Install Zsh for Linux verify scripts
        if: matrix.test == 'linux_verify_scripts'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run verify-cli-linux.sh
        if: matrix.test == 'linux_verify_scripts'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-cli-linux.sh \
            --artifact target/release/aliasmgr
          cat /tmp/aliasmgr-last-result/verification-summary.json 2>/dev/null || true
      - name: Run verify-bash-linux.sh
        if: matrix.test == 'linux_verify_scripts'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-bash-linux.sh \
            --artifact target/release/aliasmgr
          cat /tmp/aliasmgr-bash-last-result/verification-summary.json 2>/dev/null || true
      - name: Run verify-zsh-linux.sh
        if: matrix.test == 'linux_verify_scripts'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-zsh-linux.sh \
            --artifact target/release/aliasmgr
          cat /tmp/aliasmgr-zsh-last-result/verification-summary.json 2>/dev/null || true
      - name: Run core tests
        run: cargo test -p aliasmgr-core
      - name: Assert isolated configuration on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: test -n "$ALIASMGR_CONFIG_DIR" && test "$ALIASMGR_CONFIG_DIR" != "$HOME/.config/alias-manager"
      - name: Assert isolated configuration on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not $env:ALIASMGR_CONFIG_DIR) { exit 1 }
