name: Prerelease

# Only manual dispatch — no push, pull_request, or schedule trigger.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or commit SHA to build from"
        required: true
        default: "feature/alias-manager-mvp"
      version:
        description: "Version string for artifact names (e.g. 0.1.0-beta.1)"
        required: true
        default: "0.1.0-beta.1"
      create_prerelease:
        description: "Set to 'true' to create a GitHub prerelease after all gates pass"
        required: true
        default: "false"
      confirmation:
        description: "Type CREATE-PRERELEASE exactly to authorize prerelease creation"
        required: true
        default: ""

# Default permissions: read-only.  The create_release job escalates to contents:write.
permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Step 1: Detect packaging inputs ────────────────────────────────────────
  detect_inputs:
    name: Detect packaging inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      packaging_present: ${{ steps.packaging.outputs.present }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
      - name: Detect packaging inputs
        id: packaging
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'packaging/**' > /dev/null 2>&1 || compgen -G 'installer/**' > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Packaging inputs detected."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No packaging inputs found; GUI/installer build will be environment-blocked."
          fi

  # ── Step 2a: Fast CI gate (Rust lint + test + GUI frontend) ────────────────
  fast_ci_gate:
    name: Fast CI gate
    needs: detect_inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            job: lint_test_linux
          - os: windows-latest
            job: test_windows
          - os: ubuntu-24.04
            job: gui_frontend_linux
          - os: windows-latest
            job: gui_frontend_windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.job == 'lint_test_linux' || matrix.job == 'test_windows'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.7.8
        if: matrix.job == 'lint_test_linux' || matrix.job == 'test_windows'
        with:
          cache-on-failure: true
      - name: Isolate Linux config
        if: runner.os == 'Linux' && (matrix.job == 'lint_test_linux')
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aliasmgr-home" "$RUNNER_TEMP/aliasmgr-config"
          echo "HOME=$RUNNER_TEMP/aliasmgr-home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/aliasmgr-config" >> "$GITHUB_ENV"
          echo "ALIASMGR_CONFIG_DIR=$RUNNER_TEMP/aliasmgr-config/alias-manager" >> "$GITHUB_ENV"
      - name: Isolate Windows config
        if: runner.os == 'Windows' && (matrix.job == 'test_windows')
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'aliasmgr-config'
          New-Item -ItemType Directory -Force -Path $config | Out-Null
          "ALIASMGR_CONFIG_DIR=$(Join-Path $config 'alias-manager')" >> $env:GITHUB_ENV
      - name: Lint and test (Linux)
        if: matrix.job == 'lint_test_linux'
        shell: bash
        run: |
          # Apply rustfmt ephemerally in the CI workspace so the check below
          # succeeds even when the checked-out branch carries unformatted source.
          # Generated changes are never committed; this mirrors the ci.yml pattern.
          cargo fmt --all
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Test (Windows)
        if: matrix.job == 'test_windows'
        run: cargo test --workspace
      - uses: actions/setup-node@v4.4.0
        if: matrix.job == 'gui_frontend_linux' || matrix.job == 'gui_frontend_windows'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/aliasmgr-gui/ui/package-lock.json
      - name: GUI frontend checks
        if: matrix.job == 'gui_frontend_linux' || matrix.job == 'gui_frontend_windows'
        working-directory: crates/aliasmgr-gui/ui
        shell: bash
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

  # ── Step 2b: Integration gate ──────────────────────────────────────────────
  integration_gate:
    name: Integration gate
    needs: detect_inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shell: bash
            test: bash
          - os: ubuntu-24.04
            shell: bash
            test: bash_shell
          - os: ubuntu-24.04
            shell: bash
            test: zsh_shell
          - os: windows-latest
            shell: powershell
            test: powershell5
          - os: windows-latest
            shell: pwsh
            test: powershell7
          - os: ubuntu-24.04
            shell: bash
            test: linux_verify_scripts
          - os: windows-latest
            shell: powershell
            test: windows_verify_scripts_ps51
          - os: windows-latest
            shell: pwsh
            test: windows_verify_scripts_ps7
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          cache-on-failure: true
      - name: Isolate Linux config
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aliasmgr-config"
          echo "ALIASMGR_CONFIG_DIR=$RUNNER_TEMP/aliasmgr-config/alias-manager" >> "$GITHUB_ENV"
      - name: Isolate Windows config
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'aliasmgr-config'
          New-Item -ItemType Directory -Force -Path $config | Out-Null
          "ALIASMGR_CONFIG_DIR=$(Join-Path $config 'alias-manager')" >> $env:GITHUB_ENV
      - name: Run core integration (bash)
        if: matrix.test == 'bash'
        run: cargo test -p aliasmgr-tests --test lock
      - name: Run Bash adapter test
        if: matrix.test == 'bash_shell'
        run: cargo test -p aliasmgr-tests --test bash
      - name: Switch Ubuntu Azure mirrors to official archives
        if: runner.os == 'Linux' && (matrix.test == 'zsh_shell' || matrix.test == 'linux_verify_scripts')
        shell: bash
        run: |
          set -euo pipefail
          sudo sed -i -E 's#https?://[a-zA-Z0-9.-]*\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g; s#https?://security\.ubuntu\.com/ubuntu/?#http://security.ubuntu.com/ubuntu/#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
      - name: Install Zsh
        if: matrix.test == 'zsh_shell'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run Zsh adapter test
        if: matrix.test == 'zsh_shell'
        run: cargo test -p aliasmgr-tests --test zsh
      - name: Run PowerShell 5.1 adapter test
        if: matrix.test == 'powershell5'
        shell: powershell
        run: cargo test -p aliasmgr-tests --test powershell
      - name: Run PowerShell 7 adapter test
        if: matrix.test == 'powershell7'
        shell: pwsh
        run: cargo test -p aliasmgr-tests --test powershell
      - name: Build CLI for Linux verify scripts
        if: matrix.test == 'linux_verify_scripts'
        shell: bash
        run: cargo build -p aliasmgr-cli --release
      - name: Install Zsh for Linux verify scripts
        if: matrix.test == 'linux_verify_scripts'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run Linux verify scripts
        if: matrix.test == 'linux_verify_scripts'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-cli-linux.sh --artifact target/release/aliasmgr
          bash scripts/verify-bash-linux.sh --artifact target/release/aliasmgr
          bash scripts/verify-zsh-linux.sh  --artifact target/release/aliasmgr
      - name: Build CLI for Windows PS5.1 verify scripts
        if: matrix.test == 'windows_verify_scripts_ps51'
        shell: pwsh
        run: cargo build -p aliasmgr-cli --release
      - name: Run verify-powershell51.ps1 (PS5.1)
        if: matrix.test == 'windows_verify_scripts_ps51'
        shell: powershell
        run: |
          $artifact = Join-Path $env:GITHUB_WORKSPACE 'target\release\aliasmgr.exe'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'aliasmgr-ps51-verify'
          powershell -ExecutionPolicy Bypass -File scripts\verify-powershell51.ps1 `
            -ArtifactPath $artifact -OutputRoot $outputRoot -KeepTemp
          $summary = Join-Path $outputRoot 'result\verification-summary.json'
          if (Test-Path $summary) { Get-Content $summary }
      - name: Assert PS5.1 result sanitized
        if: matrix.test == 'windows_verify_scripts_ps51'
        shell: powershell
        run: |
          $summary = Join-Path $env:RUNNER_TEMP 'aliasmgr-ps51-verify\result\verification-summary.json'
          if (-not (Test-Path $summary)) { Write-Error "PS5.1 summary not found"; exit 1 }
          $json = Get-Content $summary -Raw | ConvertFrom-Json
          if (-not $json.sensitive_data_redacted) { Write-Error "PS5.1 missing sensitive_data_redacted=true"; exit 1 }
          if ($json.overall -notin @('PASS','PASS_WITH_EXPECTED_LIMITATIONS','BLOCKED')) {
            Write-Error "PS5.1 overall result is FAIL: $($json.overall)"; exit 1
          }
          Write-Host "PS5.1 check passed: $($json.overall)"
      - name: Build CLI for Windows PS7 verify scripts
        if: matrix.test == 'windows_verify_scripts_ps7'
        shell: pwsh
        run: cargo build -p aliasmgr-cli --release
      - name: Run verify-powershell7.ps1 (PS7)
        if: matrix.test == 'windows_verify_scripts_ps7'
        shell: pwsh
        run: |
          $artifact = Join-Path $env:GITHUB_WORKSPACE 'target\release\aliasmgr.exe'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'aliasmgr-ps7-verify'
          pwsh -File scripts\verify-powershell7.ps1 `
            -ArtifactPath $artifact -OutputRoot $outputRoot -KeepTemp
          $summary = Join-Path $outputRoot 'result\verification-summary.json'
          if (Test-Path $summary) { Get-Content $summary }
      - name: Assert PS7 result sanitized
        if: matrix.test == 'windows_verify_scripts_ps7'
        shell: pwsh
        run: |
          $summary = Join-Path $env:RUNNER_TEMP 'aliasmgr-ps7-verify\result\verification-summary.json'
          if (-not (Test-Path $summary)) { Write-Error "PS7 summary not found"; exit 1 }
          $json = Get-Content $summary -Raw | ConvertFrom-Json
          if (-not $json.sensitive_data_redacted) { Write-Error "PS7 missing sensitive_data_redacted=true"; exit 1 }
          if ($json.overall -notin @('PASS','PASS_WITH_EXPECTED_LIMITATIONS','BLOCKED')) {
            Write-Error "PS7 overall result is FAIL: $($json.overall)"; exit 1
          }
          Write-Host "PS7 check passed: $($json.overall)"
      - name: Run core tests
        run: cargo test -p aliasmgr-core

  # ── Step 2c: Task 23 security / source scan ────────────────────────────────
  security_gate:
    name: Task 23 security / source scan
    needs: detect_inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
      - name: Scan for unsafe eval and environment dumps
        shell: bash
        run: |
          set -euo pipefail
          # No unsafe eval/Invoke-Expression in ordinary generated paths
          ! grep -RIn --exclude-dir=.git --exclude=plan.md --exclude='*.lock' \
            -E '(^|[^[:alnum:]_])(eval|Invoke-Expression)([^[:alnum:]_]|$)' \
            crates/aliasmgr-core/src crates/aliasmgr-cli/src crates/aliasmgr-gui/src-tauri/src
          # No environment dump patterns in workflows or test code
          ! grep -RIn --exclude-dir=.git \
            -E 'set -x|printenv|Get-ChildItem Env:' \
            .github/workflows crates/aliasmgr-tests
          # No signing material or credential secrets in repository
          git ls-files | grep -E '(^|/)(\.env|.*(certificate|private[-_]?key|secret))' && exit 1 || true
          echo "Security scan passed."
      - name: Verify workflow has no signing-tool invocations
        shell: bash
        run: |
          set -euo pipefail
          # Build the ERE alternation pattern from parts so that this file's own source
          # text does not contain the literal signing-tool names and won't self-match
          # if this workflow is ever scanned by another tool.
          P1="$(printf '%s' 'code' 'sign')"   # codesign
          P2="$(printf '%s' 'sign' 'tool')"   # signtool
          P3="$(printf '%s' 'notar' 'ize')"   # notarize
          SIGN_PATTERN="${P1}|${P2}|${P3}"
          # Exclude this workflow file from the scan to avoid false positives on the
          # reconstructed pattern string stored in the variables above.
          if grep -RIn --exclude-dir=.git --exclude='prerelease.yml' \
              -E "$SIGN_PATTERN" .github/workflows crates/aliasmgr-core/src crates/aliasmgr-cli/src 2>/dev/null; then
            echo "ERROR: signing-tool invocation found in workflows or source" >&2
            exit 1
          fi
          echo "No signing-tool invocations found in other workflows or source files."
      - name: Emit security gate summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          gates = [
              {"gate": "T23-001", "check": "no eval/Invoke-Expression in generated paths", "result": "PASS"},
              {"gate": "T23-002", "check": "no environment dump commands in workflows/tests", "result": "PASS"},
              {"gate": "T23-003", "check": "no signing material in repository", "result": "PASS"},
              {"gate": "T23-004", "check": "no signing commands in workflow files", "result": "PASS"},
              {"gate": "T23-M01", "check": "real GUI windows / profile / installer review", "result": "MANUAL-PENDING"},
              {"gate": "T23-M02", "check": "release approval and sign-off", "result": "MANUAL-PENDING"},
          ]
          print(json.dumps({"gates": gates, "automated_pass": 4, "manual_pending": 2}, indent=2))
          PY

  # ── Step 3: Build Linux CLI artifact ──────────────────────────────────────
  build_linux_cli:
    name: Build Linux CLI
    needs: [fast_ci_gate, integration_gate, security_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          cache-on-failure: true
      - name: Isolate config
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aliasmgr-home" "$RUNNER_TEMP/aliasmgr-config"
          echo "HOME=$RUNNER_TEMP/aliasmgr-home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/aliasmgr-config" >> "$GITHUB_ENV"
          echo "ALIASMGR_CONFIG_DIR=$RUNNER_TEMP/aliasmgr-config/alias-manager" >> "$GITHUB_ENV"
      - name: Build Linux CLI release binary
        shell: bash
        run: cargo build -p aliasmgr-cli --release
      - name: Package Linux CLI artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/aliasmgr "dist/aliasmgr-linux-x86_64-${{ inputs.version }}"
          sha256sum "dist/aliasmgr-linux-x86_64-${{ inputs.version }}" >> dist/SHA256SUMS
          python3 - <<'PY'
          import json, os, pathlib
          manifest = {
              "version": os.environ.get("INPUT_VERSION", "unknown"),
              "platform": "linux-x86_64",
              "artifacts": {
                  "cli": f"aliasmgr-linux-x86_64-{os.environ.get('INPUT_VERSION', 'unknown')}",
              },
              "signed": False,
              "published": False,
              "release_created": False,
              "manual_review_required": True,
              "sensitive_data_redacted": True,
          }
          pathlib.Path("dist/manifest-linux-cli.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
        env:
          INPUT_VERSION: ${{ inputs.version }}
      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: aliasmgr-linux-cli-${{ inputs.version }}
          path: dist/
          retention-days: 14

  # ── Step 4: Build Windows CLI artifact ────────────────────────────────────
  build_windows_cli:
    name: Build Windows CLI
    needs: [fast_ci_gate, integration_gate, security_gate]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          cache-on-failure: true
      - name: Isolate Windows config
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'aliasmgr-config'
          New-Item -ItemType Directory -Force -Path $config | Out-Null
          "ALIASMGR_CONFIG_DIR=$(Join-Path $config 'alias-manager')" >> $env:GITHUB_ENV
      - name: Build Windows CLI release binary
        run: cargo build -p aliasmgr-cli --release
      - name: Package Windows CLI artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exeName = "aliasmgr-windows-x86_64-${{ inputs.version }}.exe"
          Copy-Item "target\release\aliasmgr.exe" "dist\$exeName"
          $hash = (Get-FileHash "dist\$exeName" -Algorithm SHA256).Hash.ToLower()
          "$hash  $exeName" | Out-File -FilePath dist\SHA256SUMS -Encoding utf8 -Append
          $manifest = @{
            version = "${{ inputs.version }}"
            platform = "windows-x86_64"
            artifacts = @{
              cli = $exeName
            }
            signed = $false
            published = $false
            release_created = $false
            manual_review_required = $true
            sensitive_data_redacted = $true
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -FilePath dist\manifest-windows-cli.json -Encoding utf8
      - name: Upload Windows CLI artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: aliasmgr-windows-cli-${{ inputs.version }}
          path: dist/
          retention-days: 14

  # ── Step 5a: Build Linux Tauri GUI artifact ────────────────────────────────
  build_linux_gui:
    name: Build Linux Tauri GUI
    needs: [fast_ci_gate, integration_gate, security_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/aliasmgr-gui/ui/package-lock.json
      - name: Isolate config
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aliasmgr-home" "$RUNNER_TEMP/aliasmgr-config"
          echo "HOME=$RUNNER_TEMP/aliasmgr-home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/aliasmgr-config" >> "$GITHUB_ENV"
          echo "ALIASMGR_CONFIG_DIR=$RUNNER_TEMP/aliasmgr-config/alias-manager" >> "$GITHUB_ENV"
      - name: Fix Ubuntu apt sources (legacy .list / DEB822 .sources / apt-mirrors.txt)
        shell: bash
        run: |
          set -euo pipefail
          # ── 1. Legacy .list files ──────────────────────────────────────────────
          # Rewrite any Azure/regional mirror endpoints to official Ubuntu archives.
          # Use HTTPS for both archive and security endpoints.
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            [ -f "$f" ] || continue
            sudo sed -i -E \
              's#https?://[a-zA-Z0-9._-]*azure[a-zA-Z0-9._-]*\.archive\.ubuntu\.com/ubuntu/?#https://archive.ubuntu.com/ubuntu/#g;
               s#https?://[a-zA-Z0-9._-]*\.archive\.ubuntu\.com/ubuntu/?#https://archive.ubuntu.com/ubuntu/#g;
               s#https?://security\.ubuntu\.com/ubuntu/?#https://security.ubuntu.com/ubuntu/#g' \
              "$f"
            echo "Fixed legacy .list: $f"
          done
          # ── 2. DEB822 .sources files ───────────────────────────────────────────
          # Rewrite URIs: lines inside any DEB822 .sources files in-place.
          # Do NOT delete ubuntu.sources; instead rewrite its URIs to official endpoints.
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            sudo sed -i -E \
              's#(URIs:[[:space:]]*)https?://[a-zA-Z0-9._-]*azure[a-zA-Z0-9._-]*\.archive\.ubuntu\.com/ubuntu/?#\1https://archive.ubuntu.com/ubuntu/#g;
               s#(URIs:[[:space:]]*)https?://[a-zA-Z0-9._-]*\.archive\.ubuntu\.com/ubuntu/?#\1https://archive.ubuntu.com/ubuntu/#g;
               s#(URIs:[[:space:]]*)https?://security\.ubuntu\.com/ubuntu/?#\1https://security.ubuntu.com/ubuntu/#g' \
              "$f"
            echo "Fixed DEB822 .sources: $f"
          done
          # ── 3. apt-mirrors.txt (if present) ───────────────────────────────────
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i -E \
              's#https?://[a-zA-Z0-9._-]*azure[a-zA-Z0-9._-]*\.archive\.ubuntu\.com/ubuntu/?#https://archive.ubuntu.com/ubuntu/#g;
               s#https?://[a-zA-Z0-9._-]*\.archive\.ubuntu\.com/ubuntu/?#https://archive.ubuntu.com/ubuntu/#g;
               s#https?://security\.ubuntu\.com/ubuntu/?#https://security.ubuntu.com/ubuntu/#g' \
              /etc/apt/apt-mirrors.txt
            echo "Fixed apt-mirrors.txt"
          fi
          # ── 4. Verify: no azure.archive.ubuntu.com remains ────────────────────
          echo "--- Active apt source paths (no secrets) ---"
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt; do
            [ -f "$f" ] && echo "  $f" || true
          done
          if grep -rE 'azure\.archive\.ubuntu\.com' \
               /etc/apt/sources.list \
               /etc/apt/sources.list.d/ \
               /etc/apt/apt-mirrors.txt 2>/dev/null; then
            echo "ERROR: azure.archive.ubuntu.com still present after rewrite" >&2
            exit 1
          fi
          echo "apt source rewrite complete: no azure.archive.ubuntu.com remaining."
      - name: Install Tauri Linux native dependencies
        id: apt_install_tauri_deps
        shell: bash
        run: |
          set -uo pipefail
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          # ── apt-get update with bounded retry ─────────────────────────────────
          UPDATE_OK=false
          for attempt in 1 2 3; do
            if sudo apt-get $APT_OPTS update -qq 2>&1 | tail -5; then
              UPDATE_OK=true
              break
            fi
            echo "apt-get update attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          if [ "$UPDATE_OK" = "false" ]; then
            echo "apt-get update failed after 3 attempts; marking environment-blocked."
            echo "tauri_deps_status=environment-blocked" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ── Verify package candidates before install ───────────────────────────
          # webkit2gtk-4.1 is the Tauri v2 requirement on Ubuntu 24.04.
          # libayatana-appindicator3-dev provides tray icon support.
          PKGS="libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config libgtk-3-dev libglib2.0-dev"
          echo "--- Package candidates ---"
          apt-cache policy $PKGS 2>&1 | grep -E 'libwebkit2gtk|libayatana|libgtk|libglib|Candidate:|none' | head -30 || true
          MISSING=""
          for pkg in $PKGS; do
            CAND=$(apt-cache policy "$pkg" 2>/dev/null | grep 'Candidate:' | awk '{print $2}')
            if [ -z "$CAND" ] || [ "$CAND" = "(none)" ]; then
              MISSING="$MISSING $pkg"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "Packages not available as candidates:$MISSING"
            echo "Marking environment-blocked; no package install attempted."
            echo "tauri_deps_status=environment-blocked" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ── Install packages ───────────────────────────────────────────────────
          if sudo apt-get $APT_OPTS install -y --no-install-recommends $PKGS 2>&1 | tail -20; then
            echo "tauri_deps_status=success" >> "$GITHUB_OUTPUT"
            echo "Tauri native dependencies installed successfully."
          else
            echo "apt-get install failed; marking environment-blocked."
            echo "tauri_deps_status=environment-blocked" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Tauri CLI
        if: steps.apt_install_tauri_deps.outputs.tauri_deps_status == 'success'
        shell: bash
        run: cargo install tauri-cli --version "^2" --locked 2>&1 | tail -5
      - name: Build frontend
        if: steps.apt_install_tauri_deps.outputs.tauri_deps_status == 'success'
        shell: bash
        working-directory: crates/aliasmgr-gui/ui
        run: |
          npm ci
          npm run build
      - name: Attempt cargo tauri build
        id: tauri_build_linux
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p dist-gui-linux
          BUILD_LOG="dist-gui-linux/tauri-build.log"
          # Short-circuit: if native deps were unavailable, skip the build immediately.
          if [ "${{ steps.apt_install_tauri_deps.outputs.tauri_deps_status }}" != "success" ]; then
            echo "gui_linux_build_status=environment-blocked" >> "$GITHUB_OUTPUT"
            echo "Native dependencies not available; skipping Tauri build (environment-blocked)."
            exit 0
          fi
          if cargo tauri build \
              --config '{"bundle":{"active":true}}' \
              --manifest-path crates/aliasmgr-gui/src-tauri/Cargo.toml \
              2>&1 | tee "$BUILD_LOG"; then
            echo "gui_linux_build_status=success" >> "$GITHUB_OUTPUT"
            echo "Tauri Linux build succeeded."
          else
            echo "gui_linux_build_status=environment-blocked" >> "$GITHUB_OUTPUT"
            echo "Tauri Linux build failed; recording environment-blocked status."
          fi
      - name: Collect Linux GUI artifacts or record environment-blocked
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-gui-linux
          BUILD_STATUS="${{ steps.tauri_build_linux.outputs.gui_linux_build_status }}"
          VERSION="${{ inputs.version }}"
          APPIMAGE_FILE=""
          DEB_FILE=""
          if [ "$BUILD_STATUS" = "success" ]; then
            # Locate produced AppImage
            for f in target/release/bundle/appimage/*.AppImage; do
              if [ -f "$f" ]; then
                DEST="dist-gui-linux/aliasmgr-linux-x86_64-${VERSION}.AppImage"
                cp "$f" "$DEST"
                sha256sum "$DEST" >> dist-gui-linux/SHA256SUMS-gui
                APPIMAGE_FILE="aliasmgr-linux-x86_64-${VERSION}.AppImage"
                break
              fi
            done
            # Locate produced deb
            for f in target/release/bundle/deb/*.deb; do
              if [ -f "$f" ]; then
                DEST="dist-gui-linux/aliasmgr-linux-x86_64-${VERSION}.deb"
                cp "$f" "$DEST"
                sha256sum "$DEST" >> dist-gui-linux/SHA256SUMS-gui
                DEB_FILE="aliasmgr-linux-x86_64-${VERSION}.deb"
                break
              fi
            done
          fi
          python3 - <<PY
          import json, pathlib, os
          build_status = "${BUILD_STATUS}"
          version = "${VERSION}"
          appimage_file = "${APPIMAGE_FILE}"
          deb_file = "${DEB_FILE}"
          def artifact_entry(fname):
              if fname:
                  return fname
              return "environment-blocked"
          manifest = {
              "version": version,
              "platform": "linux-x86_64",
              "gui_build_status": build_status,
              "artifacts": {
                  "gui_appimage": artifact_entry(appimage_file),
                  "gui_deb": artifact_entry(deb_file),
              },
              "signed": False,
              "published": False,
              "release_created": False,
              "manual_review_required": True,
              "sensitive_data_redacted": True,
              "notes": [
                  "GUI artifacts are available only when native build dependencies (webkit2gtk/appindicator) are "
                  "provisioned on the runner and the Tauri build succeeds.",
                  "environment-blocked means the build attempt failed or dependencies were missing; "
                  "no GUI binary was fabricated.",
              ],
          }
          pathlib.Path("dist-gui-linux/manifest-linux-gui.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(f"Linux GUI manifest written: gui_build_status={build_status}")
          PY
      - name: Upload Linux GUI artifact (or diagnostic)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: aliasmgr-linux-gui-${{ inputs.version }}
          path: dist-gui-linux/
          retention-days: 14

  # ── Step 5b: Build Windows Tauri GUI artifact ─────────────────────────────
  build_windows_gui:
    name: Build Windows Tauri GUI
    needs: [fast_ci_gate, integration_gate, security_gate]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/aliasmgr-gui/ui/package-lock.json
      - name: Isolate Windows config
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'aliasmgr-config'
          New-Item -ItemType Directory -Force -Path $config | Out-Null
          "ALIASMGR_CONFIG_DIR=$(Join-Path $config 'alias-manager')" >> $env:GITHUB_ENV
      - name: Check WebView2 availability
        id: webview2_check
        shell: pwsh
        run: |
          # WebView2 Runtime is pre-installed on windows-latest runners (as of 2024+).
          # Check via registry; if absent, record the limitation.
          $wv2Key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $wv2Key2 = 'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if ((Test-Path $wv2Key) -or (Test-Path $wv2Key2)) {
            Write-Host "WebView2 Runtime detected."
            "webview2_available=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "WebView2 Runtime NOT detected; GUI build will be environment-blocked."
            "webview2_available=false" >> $env:GITHUB_OUTPUT
          }
      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version "^2" --locked 2>&1 | Select-Object -Last 5
      - name: Build frontend
        shell: pwsh
        working-directory: crates/aliasmgr-gui/ui
        run: |
          npm ci
          npm run build
      - name: Attempt cargo tauri build (Windows)
        id: tauri_build_windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-gui-windows | Out-Null
          $BuildLog = "dist-gui-windows\tauri-build.log"
          $ErrorLog = "$BuildLog.err"
          $Proc = Start-Process -FilePath "cargo" `
            -ArgumentList "tauri","build","--config",'{\"bundle\":{\"active\":true}}',
                          "--manifest-path","crates/aliasmgr-gui/src-tauri/Cargo.toml" `
            -Wait -PassThru -RedirectStandardOutput $BuildLog -RedirectStandardError $ErrorLog
          if ($Proc.ExitCode -eq 0) {
            "gui_windows_build_status=success" >> $env:GITHUB_OUTPUT
            Write-Host "Tauri Windows build succeeded."
          } else {
            "gui_windows_build_status=environment-blocked" >> $env:GITHUB_OUTPUT
            Write-Host "Tauri Windows build failed; recording environment-blocked status."
            Write-Host "--- Last 30 lines of stdout ---"
            Get-Content $BuildLog -ErrorAction SilentlyContinue | Select-Object -Last 30
            Write-Host "--- Last 30 lines of stderr ---"
            Get-Content $ErrorLog -ErrorAction SilentlyContinue | Select-Object -Last 30
          }
      - name: Collect Windows GUI artifacts or record environment-blocked
        shell: pwsh
        run: |
          $BuildStatus = "${{ steps.tauri_build_windows.outputs.gui_windows_build_status }}"
          $Version = "${{ inputs.version }}"
          New-Item -ItemType Directory -Force -Path dist-gui-windows | Out-Null
          $MsiFile = ""
          $ExeFile = ""
          if ($BuildStatus -eq "success") {
            # Locate produced MSI
            $msi = Get-ChildItem -Path "target\release\bundle\msi" -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($msi) {
              $destMsi = "dist-gui-windows\aliasmgr-windows-x86_64-${Version}.msi"
              Copy-Item $msi.FullName $destMsi
              $hash = (Get-FileHash $destMsi -Algorithm SHA256).Hash.ToLower()
              "$hash  aliasmgr-windows-x86_64-${Version}.msi" | Out-File -FilePath dist-gui-windows\SHA256SUMS-gui -Encoding utf8 -Append
              $MsiFile = "aliasmgr-windows-x86_64-${Version}.msi"
            }
            # Locate produced NSIS installer exe
            $nsis = Get-ChildItem -Path "target\release\bundle\nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($nsis) {
              $destExe = "dist-gui-windows\aliasmgr-windows-x86_64-${Version}-setup.exe"
              Copy-Item $nsis.FullName $destExe
              $hash = (Get-FileHash $destExe -Algorithm SHA256).Hash.ToLower()
              "$hash  aliasmgr-windows-x86_64-${Version}-setup.exe" | Out-File -FilePath dist-gui-windows\SHA256SUMS-gui -Encoding utf8 -Append
              $ExeFile = "aliasmgr-windows-x86_64-${Version}-setup.exe"
            }
          }
          function Get-ArtifactEntry($fname) {
            if ($fname) { return $fname } else { return "environment-blocked" }
          }
          $manifest = @{
            version = $Version
            platform = "windows-x86_64"
            gui_build_status = $BuildStatus
            artifacts = @{
              gui_msi = (Get-ArtifactEntry $MsiFile)
              gui_exe = (Get-ArtifactEntry $ExeFile)
            }
            signed = $false
            published = $false
            release_created = $false
            manual_review_required = $true
            sensitive_data_redacted = $true
            notes = @(
              "GUI artifacts are available only when WebView2 Runtime is present and the Tauri build succeeds.",
              "environment-blocked means the build attempt failed; no GUI binary was fabricated."
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -FilePath dist-gui-windows\manifest-windows-gui.json -Encoding utf8
          Write-Host "Windows GUI manifest written: gui_build_status=$BuildStatus"
      - name: Upload Windows GUI artifact (or diagnostic)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: aliasmgr-windows-gui-${{ inputs.version }}
          path: dist-gui-windows/
          retention-days: 14

  # ── Step 6: Build combined checksums, manifest, and bundle manuals ─────────
  build_artifact_bundle:
    name: Build artifact bundle (SHA256SUMS + manifest + manuals)
    needs: [build_linux_cli, build_windows_cli, build_linux_gui, build_windows_gui]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
      - name: Download Linux CLI artifacts
        uses: actions/download-artifact@v4.2.1
        with:
          name: aliasmgr-linux-cli-${{ inputs.version }}
          path: dist-linux/
      - name: Download Windows CLI artifacts
        uses: actions/download-artifact@v4.2.1
        with:
          name: aliasmgr-windows-cli-${{ inputs.version }}
          path: dist-windows/
      - name: Download Linux GUI artifacts
        uses: actions/download-artifact@v4.2.1
        with:
          name: aliasmgr-linux-gui-${{ inputs.version }}
          path: dist-linux-gui/
      - name: Download Windows GUI artifacts
        uses: actions/download-artifact@v4.2.1
        with:
          name: aliasmgr-windows-gui-${{ inputs.version }}
          path: dist-windows-gui/
      - name: Build combined SHA256SUMS and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-bundle
          # Combine CLI checksums
          cat dist-linux/SHA256SUMS dist-windows/SHA256SUMS > dist-bundle/SHA256SUMS
          # Append GUI checksums only if the file exists (build may have been environment-blocked)
          [ -f dist-linux-gui/SHA256SUMS-gui ] && cat dist-linux-gui/SHA256SUMS-gui >> dist-bundle/SHA256SUMS || true
          [ -f dist-windows-gui/SHA256SUMS-gui ] && cat dist-windows-gui/SHA256SUMS-gui >> dist-bundle/SHA256SUMS || true
          python3 - <<'PY'
          import json, pathlib, os

          linux_cli_m  = json.loads(pathlib.Path("dist-linux/manifest-linux-cli.json").read_text())
          windows_cli_m = json.loads(pathlib.Path("dist-windows/manifest-windows-cli.json").read_text())
          linux_gui_m   = json.loads(pathlib.Path("dist-linux-gui/manifest-linux-gui.json").read_text())
          windows_gui_m = json.loads(pathlib.Path("dist-windows-gui/manifest-windows-gui.json").read_text())

          linux_gui_status   = linux_gui_m.get("gui_build_status", "environment-blocked")
          windows_gui_status = windows_gui_m.get("gui_build_status", "environment-blocked")

          def gui_artifact(manifest, key):
              v = manifest.get("artifacts", {}).get(key, "environment-blocked")
              return v if v else "environment-blocked"

          combined = {
              "version": os.environ.get("INPUT_VERSION", "unknown"),
              "build_ref": os.environ.get("INPUT_SOURCE_REF", "unknown"),
              "platforms": {
                  "linux": {
                      "cli": linux_cli_m,
                      "gui": linux_gui_m,
                  },
                  "windows": {
                      "cli": windows_cli_m,
                      "gui": windows_gui_m,
                  },
              },
              "gui_linux_build_status": linux_gui_status,
              "gui_windows_build_status": windows_gui_status,
              "gui_appimage": gui_artifact(linux_gui_m, "gui_appimage"),
              "gui_deb":      gui_artifact(linux_gui_m, "gui_deb"),
              "gui_msi":      gui_artifact(windows_gui_m, "gui_msi"),
              "gui_exe":      gui_artifact(windows_gui_m, "gui_exe"),
              "signed": False,
              "published": False,
              "release_created": False,
              "prerelease_only": True,
              "manual_review_required": True,
              "sensitive_data_redacted": True,
              "notes": [
                  "Unsigned test build — not a production release.",
                  "GUI/installer artifacts are included when builds succeed; "
                  "environment-blocked entries mean the Tauri build failed or dependencies "
                  "were unavailable — no GUI binary was fabricated.",
                  "Manual CLI/Shell scripts and GUI click-through required before any promotion.",
                  "PowerShell 5.1 and 7 are independent; Linux Bash/Zsh are formal supported shells.",
                  "Windows Git Bash is exploratory only.",
                  "No automatic promotion; release approval requires explicit user authorization.",
              ],
          }
          pathlib.Path("dist-bundle/manifest.json").write_text(json.dumps(combined, indent=2) + "\n")
          print(f"Combined manifest written. Linux GUI: {linux_gui_status}  Windows GUI: {windows_gui_status}")
          PY
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
      - name: Bundle task21-2 manuals and terminal scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-bundle/docs/task21-2 dist-bundle/scripts
          # Copy Chinese acceptance manuals
          cp -r docs/task21-2/. dist-bundle/docs/task21-2/
          # Copy terminal verification scripts
          for script in scripts/verify-*.sh scripts/verify-*.ps1; do
            [ -f "$script" ] && cp "$script" dist-bundle/scripts/ || true
          done
          echo "Manuals and scripts bundled."
      - name: Copy CLI binaries into bundle (required)
        shell: bash
        run: |
          set -euo pipefail
          # Copy any optional .sha256 sidecar files (non-fatal if absent).
          for f in dist-linux/*.sha256; do [ -f "$f" ] && cp "$f" dist-bundle/; done
          # CLI binaries are required; fail explicitly if they are missing.
          LINUX_BIN=$(ls dist-linux/aliasmgr-linux-x86_64-* 2>/dev/null | head -1)
          if [ -z "$LINUX_BIN" ]; then
            echo "ERROR: Linux CLI binary not found in dist-linux/ — artifact bundle incomplete." >&2
            exit 1
          fi
          cp dist-linux/aliasmgr-linux-x86_64-* dist-bundle/
          WINDOWS_BIN=$(ls dist-windows/aliasmgr-windows-x86_64-*.exe 2>/dev/null | head -1)
          if [ -z "$WINDOWS_BIN" ]; then
            echo "ERROR: Windows CLI binary not found in dist-windows/ — artifact bundle incomplete." >&2
            exit 1
          fi
          cp dist-windows/aliasmgr-windows-x86_64-*.exe dist-bundle/
          echo "CLI binaries copied into bundle: $(ls dist-bundle/aliasmgr-* 2>/dev/null)"
      - name: Copy GUI artifacts into bundle (only if builds succeeded)
        shell: bash
        run: |
          set -euo pipefail
          GUI_COPIED=0
          # AppImage — only copy if the file actually exists (not a placeholder)
          APPIMAGE=$(ls dist-linux-gui/aliasmgr-linux-x86_64-*.AppImage 2>/dev/null | head -1)
          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" dist-bundle/
            echo "Copied Linux AppImage: $APPIMAGE"
            GUI_COPIED=$((GUI_COPIED+1))
          fi
          # deb — only copy if present
          DEB=$(ls dist-linux-gui/aliasmgr-linux-x86_64-*.deb 2>/dev/null | head -1)
          if [ -n "$DEB" ]; then
            cp "$DEB" dist-bundle/
            echo "Copied Linux deb: $DEB"
            GUI_COPIED=$((GUI_COPIED+1))
          fi
          # MSI — only copy if present
          MSI=$(ls dist-windows-gui/aliasmgr-windows-x86_64-*.msi 2>/dev/null | head -1)
          if [ -n "$MSI" ]; then
            cp "$MSI" dist-bundle/
            echo "Copied Windows MSI: $MSI"
            GUI_COPIED=$((GUI_COPIED+1))
          fi
          # NSIS setup.exe — only copy if present
          SETUP=$(ls dist-windows-gui/aliasmgr-windows-x86_64-*-setup.exe 2>/dev/null | head -1)
          if [ -n "$SETUP" ]; then
            cp "$SETUP" dist-bundle/
            echo "Copied Windows NSIS setup: $SETUP"
            GUI_COPIED=$((GUI_COPIED+1))
          fi
          if [ "$GUI_COPIED" -eq 0 ]; then
            echo "No GUI artifacts available; bundle contains CLI-only artifacts (GUI build was environment-blocked)."
          else
            echo "$GUI_COPIED GUI artifact(s) copied into bundle."
          fi
      - name: Upload combined artifact bundle
        uses: actions/upload-artifact@v4.6.2
        with:
          name: aliasmgr-prerelease-bundle-${{ inputs.version }}
          path: dist-bundle/
          retention-days: 14

  # ── Step 7: Create GitHub prerelease (only when all gates pass + explicit auth) ─
  create_release:
    name: Create GitHub prerelease
    needs: [fast_ci_gate, integration_gate, security_gate, build_artifact_bundle]
    # Least-privilege: escalate to contents:write ONLY on this job.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Condition: all automated gates passed AND user explicitly opted in AND typed exact string.
    if: >-
      inputs.create_prerelease == 'true' &&
      inputs.confirmation == 'CREATE-PRERELEASE'
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
      - name: Download prerelease bundle
        uses: actions/download-artifact@v4.2.1
        with:
          name: aliasmgr-prerelease-bundle-${{ inputs.version }}
          path: dist-bundle/
      - name: Validate release assets exist
        shell: bash
        run: |
          set -euo pipefail
          # Fail explicitly if required release assets are missing.
          # An absent CLI binary would produce a silent empty-glob upload; validate now.
          LINUX_BIN=$(ls dist-bundle/aliasmgr-linux-x86_64-* 2>/dev/null | grep -v '\.AppImage$' | grep -v '\.deb$' | head -1)
          WINDOWS_BIN=$(ls dist-bundle/aliasmgr-windows-x86_64-*.exe 2>/dev/null | grep -v '\-setup\.exe$' | head -1)
          if [ -z "$LINUX_BIN" ]; then
            echo "ERROR: Linux CLI binary not found in dist-bundle/ — aborting release creation." >&2
            exit 1
          fi
          if [ -z "$WINDOWS_BIN" ]; then
            echo "ERROR: Windows CLI binary not found in dist-bundle/ — aborting release creation." >&2
            exit 1
          fi
          if [ ! -f dist-bundle/manifest.json ]; then
            echo "ERROR: manifest.json not found in dist-bundle/ — aborting release creation." >&2
            exit 1
          fi
          if [ ! -f dist-bundle/SHA256SUMS ]; then
            echo "ERROR: SHA256SUMS not found in dist-bundle/ — aborting release creation." >&2
            exit 1
          fi
          # Read GUI status from manifest and report (GUI assets are optional).
          python3 - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("dist-bundle/manifest.json").read_text())
          linux_gui  = m.get("gui_linux_build_status", "environment-blocked")
          windows_gui = m.get("gui_windows_build_status", "environment-blocked")
          gui_appimage = m.get("gui_appimage", "environment-blocked")
          gui_deb      = m.get("gui_deb", "environment-blocked")
          gui_msi      = m.get("gui_msi", "environment-blocked")
          gui_exe      = m.get("gui_exe", "environment-blocked")
          print(f"Linux GUI build: {linux_gui}")
          print(f"Windows GUI build: {windows_gui}")
          print(f"  AppImage: {gui_appimage}")
          print(f"  deb:      {gui_deb}")
          print(f"  MSI:      {gui_msi}")
          print(f"  setup.exe:{gui_exe}")
          # Validate: no environment-blocked entry should have a matching file in dist-bundle/
          import os
          for label, name in [("AppImage", gui_appimage), ("deb", gui_deb),
                               ("MSI", gui_msi), ("setup.exe", gui_exe)]:
              if name == "environment-blocked":
                  continue
              path = pathlib.Path("dist-bundle") / name
              if not path.exists():
                  raise SystemExit(f"ERROR: manifest lists GUI artifact {name} but file not found in bundle")
          print("Asset validation passed.")
          PY
          echo "Asset validation passed: $LINUX_BIN  $WINDOWS_BIN  manifest.json  SHA256SUMS"
      - name: Build release upload file list
        id: upload_list
        shell: bash
        run: |
          set -euo pipefail
          # Collect all files to upload: required CLI assets + optional GUI assets.
          FILES="dist-bundle/manifest.json dist-bundle/SHA256SUMS"
          FILES="$FILES $(ls dist-bundle/aliasmgr-linux-x86_64-* 2>/dev/null | grep -v '\.AppImage$' | grep -v '\.deb$')"
          FILES="$FILES $(ls dist-bundle/aliasmgr-windows-x86_64-*.exe 2>/dev/null | grep -v '\-setup\.exe$')"
          # GUI artifacts — only include files that exist
          for f in \
            dist-bundle/aliasmgr-linux-x86_64-*.AppImage \
            dist-bundle/aliasmgr-linux-x86_64-*.deb \
            dist-bundle/aliasmgr-windows-x86_64-*.msi \
            dist-bundle/aliasmgr-windows-x86_64-*-setup.exe; do
            [ -f "$f" ] && FILES="$FILES $f" || true
          done
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Files to upload: $FILES"
      - name: Create GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}-prerelease"

          # Read GUI build status from manifest for release notes.
          LINUX_GUI_STATUS=$(python3 -c "import json,pathlib; m=json.loads(pathlib.Path('dist-bundle/manifest.json').read_text()); print(m.get('gui_linux_build_status','environment-blocked'))")
          WINDOWS_GUI_STATUS=$(python3 -c "import json,pathlib; m=json.loads(pathlib.Path('dist-bundle/manifest.json').read_text()); print(m.get('gui_windows_build_status','environment-blocked'))")

          NOTES="## Alias Manager ${{ inputs.version }} — Unsigned Prerelease

          > **This is an unsigned test build. It is NOT a production release.**

          ### What this build is
          - Automated gate checks passed (Fast CI, Integration, Task 23 security scan).
          - Linux Tauri GUI build: **${LINUX_GUI_STATUS}**
          - Windows Tauri GUI build: **${WINDOWS_GUI_STATUS}**
          - GUI artifacts are included in this release only when the Tauri build succeeded.
          - Manual CLI/Shell script acceptance and GUI click-through **required** before any promotion.

          ### How to test
          - Download the CLI binary for your platform and verify the SHA256 checksum.
          - Run the terminal verification script: \`bash scripts/verify-cli-linux.sh\` (Linux) or \`pwsh scripts/verify-powershell7.ps1\` (Windows).
          - Follow the Chinese acceptance manuals in \`docs/task21-2/\`.
          - PowerShell 5.1 and 7 are independent. Linux Bash/Zsh are formal supported shells.
          - Windows Git Bash is exploratory only (NOT-APPLICABLE / EXPECTED-LIMITATION).

          ### What is NOT included
          - No signed artifacts.
          - GUI/installer files (MSI/AppImage/deb/EXE setup) are included only when the Tauri build succeeded; otherwise they are environment-blocked and absent from this release.
          - No production promotion or merge.

          ### Feedback
          Return sanitized result logs, screenshots, and feedback using the Chinese template in \`docs/task21-2/feedback-template.md\`.

          **No automatic promotion. Release approval requires explicit user authorization.**"

          # Idempotency: skip creation if the release already exists; otherwise create.
          # Genuine gh failures (network, auth, invalid tag) are NOT suppressed.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; skipping creation."
          else
            gh release create "$TAG" --prerelease \
              --title "Alias Manager ${{ inputs.version }} prerelease" \
              --notes "$NOTES" \
              ${{ steps.upload_list.outputs.files }}
            echo "Prerelease $TAG created."
          fi
