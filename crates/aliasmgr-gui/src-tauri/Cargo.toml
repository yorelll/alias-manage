[package]
name = "aliasmgr-gui"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = "2"

[dependencies]
aliasmgr-core = { path = "../../aliasmgr-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }

# Keep this crate standalone. Without its own workspace root, Cargo walks up
# from a git worktree nested inside the main checkout and finds the outer
# workspace, where this package is excluded rather than a member.
[workspace]
